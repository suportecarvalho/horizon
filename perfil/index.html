<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head><link rel="icon" type="image/png" href="/favicon.png"><link rel="shortcut icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sua Conta - Horizon</title>
  <script>
    (async function() {
      try {
        const cached = localStorage.getItem('horizon_steam_user');
        if (cached) {
          const u = JSON.parse(cached);
          if (u && (u.steamId || u.steamid)) {
            window.location.replace('/leaderboards/' + (u.steamId || u.steamid));
            return;
          }
        }
      } catch(e) {}
      try {
        const res = await fetch('/api/me');
        if (res.ok) {
          const data = await res.json();
          if (data && data.authenticated && data.user) {
            const sid = data.user.steamId || data.user.steamid;
            try { localStorage.setItem('horizon_steam_user', JSON.stringify(data.user)); } catch(e) {}
            window.location.replace('/leaderboards/' + sid);
            return;
          }
        }
      } catch(e) {}
      window.location.replace('/auth/steam?redirect=/perfil');
    })();
  </script>
</head>
<body style="background:#13100F; color:#EDE8E5; display:flex; align-items:center; justify-content:center; height:100vh; font-family:system-ui, sans-serif; margin:0;">
  <div style="text-align:center;">
    <div style="display:inline-block; width:36px; height:36px; border:3px solid rgba(215,87,59,0.3); border-top-color:#D7573B; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
    <p style="margin-top:14px; font-size:0.95rem; color:#A1A1AA;">Carregando sua conta...</p>
  </div>
  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
